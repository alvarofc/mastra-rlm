name: release-mastra-rlm-kit

on:
  workflow_dispatch:
  push:
    tags:
      - "mastra-rlm-kit-v*"

concurrency:
  group: release-mastra-rlm-kit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package typecheck
        run: bun run --cwd packages/mastra-rlm typecheck

      - name: Build package
        run: bun run --cwd packages/mastra-rlm build

      - name: Validate package tarball
        run: bun run --cwd packages/mastra-rlm pack:dry

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./packages/mastra-rlm/package.json').version")
          EXPECTED="mastra-rlm-kit-v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag '$TAG' does not match expected '$EXPECTED'"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/mastra-rlm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
